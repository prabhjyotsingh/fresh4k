<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>IP TV</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<video id="video"></video>
<div id="app">
  <div id="header">
    <div id="brand">IP <b>TV</b></div>
    <div id="tabs"></div>
    <div id="clock"></div>
  </div>
  <div id="side">
    <div id="cats"></div>
  </div>
  <div id="searchbox"><input id="search" type="text" placeholder="Search movies &amp; series"></div>
  <div id="findbar"><input id="find" type="text"></div>
  <div id="grid"></div>
  <div id="hint">OK open &nbsp; ◄► navigate &nbsp; ▲ search &nbsp; BACK return &nbsp; <span class="blue">■</span> My List &nbsp; <span style="color:#e5534b">■</span> Reload</div>
</div>
<div id="detail">
  <div id="d-poster"></div>
  <div id="d-body">
    <div id="d-title"></div>
    <div id="d-meta"></div>
    <div id="d-desc"></div>
    <div id="d-crumb"></div>
    <div id="d-list"></div>
  </div>
</div>
<div id="osd">
  <div id="osd-title"></div>
  <div id="osd-bar"><div id="osd-fill"></div></div>
  <div id="osd-row"><span id="osd-state"></span><span id="osd-time"></span></div>
  <div id="osd-hint">GREEN: audio &amp; subtitles</div>
</div>
<div id="pmenu"></div>
<div id="volosd">
  <div id="voltrack"><div id="volfill"></div></div>
  <div id="voltxt"></div>
</div>
<div id="pinbox">
  <div id="pin-title">Adult content: enter PIN</div>
  <input id="pin" type="password" maxlength="8" inputmode="numeric" autocomplete="off">
  <div id="pin-hint">OK unlock &nbsp; BACK cancel</div>
</div>
<div id="spinner"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
